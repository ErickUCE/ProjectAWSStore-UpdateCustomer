name: CI for UpdateCustomer 🚀

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest  # Se ejecuta en un entorno Ubuntu (si es necesario, también puedes cambiarlo por un entorno Linux)

    steps:
    - name: Checkout code 📦
      uses: actions/checkout@v3

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub 🔐
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image 🔨
      run: |
        sudo docker build -t erickuce/projectawsstore-updatecustomer:latest .

    - name: Push Docker image to Docker Hub 🌍
      run: |
        for i in {1..3}; do
          docker push erickuce/projectawsstore-updatecustomer:latest && break || sleep 20;
        done

    - name: Add EC2 host to known_hosts 🌐
      run: |
        echo "Verificando si ~/.ssh existe y creándolo..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "Añadiendo la clave del host EC2..."
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || echo "Error: No se pudo añadir la clave del host EC2"
        chmod 644 ~/.ssh/known_hosts
        echo "La clave del host EC2 se añadió correctamente."

    - name: Test SSH connection to EC2 🔒
      run: |
        echo "Probando la conexión SSH a EC2..."
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Eliminar saltos de línea adicionales
        chmod 600 private_key.pem  # Asignar permisos adecuados
        # Conectar con el usuario ec2-user de Amazon Linux 2
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=60 ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          echo "Conexión SSH exitosa a EC2."
        EOF

    - name: Deploy to EC2 (Optional) 🌐
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ec2-user  # Cambiar el nombre de usuario a ec2-user para Amazon Linux 2
      run: |
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Eliminar saltos de línea adicionales
        chmod 600 private_key.pem
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
          sudo docker pull erickuce/projectawsstore-updatecustomer:latest
          sudo docker run -d -p 8083:8083 erickuce/projectawsstore-updatecustomer:latest
        EOF
