name: CI for UpdateCustomer 🚀

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code 📦
      uses: actions/checkout@v3

    - name: Set up Docker Buildx 🐳
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub 🔐
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Usar el nombre de usuario de Docker Hub
        password: ${{ secrets.DOCKER_PASSWORD }}  # Usar la contraseña de Docker Hub

    - name: Build Docker image 🔨
      run: |
        sudo docker build -t erickuce/projectawsstore-updatecustomer:latest .  # Construir la imagen

    - name: Push Docker image to Docker Hub 🌍
      run: |
        for i in {1..3}; do
          docker push erickuce/projectawsstore-updatecustomer:latest && break || sleep 20;  # Subir la imagen
        done

    - name: Add EC2 host to known_hosts 🌐
      run: |
        echo "Verificando si ~/.ssh existe y creándolo..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "Añadiendo la clave del host EC2..."
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || echo "Error: No se pudo añadir la clave del host EC2"
        chmod 644 ~/.ssh/known_hosts
        echo "La clave del host EC2 se añadió correctamente."

    - name: Test SSH connection to EC2 🔒
      run: |
        echo "Probando la conexión SSH a EC2..."
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Eliminar saltos de línea
        chmod 600 private_key.pem  # Asignar permisos adecuados

        # Verificar los permisos y contenido del archivo de clave privada
        ls -l private_key.pem
        cat private_key.pem    # Verificar el contenido de la clave privada

        # Intentar la conexión SSH con un mayor tiempo de espera
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=60 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          echo "Conexión SSH exitosa a EC2."
        EOF

    - name: Deploy to EC2 (Optional) 🌐
      env:
        PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        MONGO_URI: mongodb://44.217.27.149:27017/UpdateCustomerDB  # Variables de entorno
        MONGO_DB_NAME: UpdateCustomerDB
        PORT: 8083
        CREATE_CUSTOMER_SERVICE: http://localhost:8081
        READ_CUSTOMER_SERVICE: http://localhost:8082
        DELETE_CUSTOMER_SERVICE: http://localhost:8084
      run: |
        # Guardar la clave privada en un archivo temporal y establecer permisos
        echo "$PRIVATE_KEY" | tr -d '\r' > private_key.pem  # Quitar saltos de línea adicionales
        chmod 600 private_key.pem
        echo "La clave privada SSH se almacenó correctamente."

        # Asegurarse de que la clave se maneje correctamente para la conexión SSH
        echo "Conectando a EC2 para desplegar..."
        ssh -T -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
          sudo docker pull erickuce/projectawsstore-updatecustomer:latest
          sudo docker run -d -p 8083:8083 --env MONGO_URI=${MONGO_URI} --env MONGO_DB_NAME=${MONGO_DB_NAME} --env PORT=${PORT} --env CREATE_CUSTOMER_SERVICE=${CREATE_CUSTOMER_SERVICE} --env READ_CUSTOMER_SERVICE=${READ_CUSTOMER_SERVICE} --env DELETE_CUSTOMER_SERVICE=${DELETE_CUSTOMER_SERVICE} erickuce/projectawsstore-updatecustomer:latest  # Ejecutar la imagen en EC2 con variables de entorno
        EOF
